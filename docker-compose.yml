services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-series}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-series}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-series} -d ${POSTGRES_DB:-series}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  series:
    image: series-ts:${SERIES_TAG:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERIES_PG_DSN: postgres://${POSTGRES_USER:-series}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-series}?sslmode=disable
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
